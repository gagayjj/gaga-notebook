<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#262626" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>GAGA的笔记本</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <img src="./icons/icon-192.png" alt="logo" />
        <div>
          <strong>GAGA的笔记本</strong>
          <span>边学边记</span>
        </div>
      </header>

      <main>
        <section id="tab-notes" class="page active">
          <div class="page-head">
            <h2>我的笔记</h2>
            <span id="notes-count"></span>
          </div>
          <div class="card note-editor">
            <input id="note-title" placeholder="笔记标题" />
            <textarea id="note-content" placeholder="开始记笔记..."></textarea>
            <div class="row">
              <button id="save-note" class="btn primary">保存笔记</button>
              <button id="new-note" class="btn">新建</button>
            </div>
          </div>
          <div id="notes-list" class="list"></div>
        </section>

        <section id="tab-english" class="page">
          <div class="page-head">
            <h2>每日英语</h2>
            <span id="english-date"></span>
          </div>
          <div class="card lesson-card">
            <div class="lesson-word-row">
              <div>
                <h3 id="lesson-word"></h3>
                <span id="lesson-phonetic"></span>
              </div>
              <button id="speak-word" class="round-btn">听</button>
            </div>
            <p id="lesson-meaning"></p>
            <p id="lesson-sentence"></p>
            <p id="lesson-sentence-cn" class="muted"></p>
            <div class="row">
              <button id="speak-sentence" class="btn">读例句</button>
              <button id="slow-speak" class="btn">慢速</button>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <strong>我的生词</strong>
            </div>
            <div class="inline-form">
              <input id="word-input" placeholder="单词" />
              <input id="meaning-input" placeholder="释义" />
              <button id="add-word" class="btn primary">加入</button>
            </div>
            <div id="word-list" class="list"></div>
          </div>

          <div class="card">
            <div class="card-head">
              <strong>默写</strong>
              <span id="dict-result"></span>
            </div>
            <p id="dict-prompt" class="muted">点开始，根据释义默写单词</p>
            <div class="row">
              <button id="start-dict" class="btn primary">开始默写</button>
              <button id="hear-answer" class="btn">听发音</button>
            </div>
            <input id="dict-input" placeholder="拼写出单词" hidden />
            <button id="check-dict" class="btn" hidden>检查</button>
          </div>
        </section>

        <section id="tab-plans" class="page">
          <div class="page-head">
            <h2>学习计划</h2>
            <button id="enable-notify" class="mini-btn">开提醒</button>
          </div>
          <div class="card">
            <input id="plan-title" placeholder="今天要学什么" />
            <div class="inline-form">
              <input type="date" id="plan-date" />
              <input type="time" id="plan-time" />
              <button id="add-plan" class="btn primary">添加</button>
            </div>
          </div>
          <div id="plan-list" class="list"></div>
        </section>

        <section id="tab-mine" class="page">
          <div class="card mine-card">
            <img src="./icons/icon-192.png" alt="GAGA" />
            <h2>GAGA的笔记本</h2>
            <p class="muted">手机网页版 · 数据存在本机浏览器</p>
            <div id="mine-stats" class="stats"></div>
            <button id="clear-data" class="btn danger">清空本机数据</button>
          </div>
        </section>

        <section id="tab-marker" class="page">
          <div class="page-head">
            <h2>标记</h2>
            <span id="marker-count"></span>
          </div>
          <div class="card">
            <div class="row">
              <button id="new-canvas" class="btn primary">新建画板</button>
              <button id="pick-image" class="btn">选择图片</button>
              <input type="file" id="marker-file" accept="image/*" hidden />
            </div>
            <p class="muted">画完箭头可以选中，拖两端随意伸缩，拖中间移动，还能继续加</p>
          </div>
          <div id="marker-list" class="list"></div>
        </section>
      </main>

      <nav class="tabbar">
        <button data-tab="notes" class="active">笔记</button>
        <button data-tab="english">英语</button>
        <button data-tab="plans">计划</button>
        <button data-tab="marker">标记</button>
        <button data-tab="mine">我的</button>
      </nav>
    </div>

    <div id="marker-editor" class="modal" hidden>
      <div class="marker-toolbar">
        <button id="mt-arrow" class="active">箭头</button>
        <button id="mt-pen">画笔</button>
        <button id="mt-text">文字</button>
        <span class="color-row">
          <i data-color="#e91e63" style="background:#e91e63"></i>
          <i data-color="#3b82f6" style="background:#3b82f6"></i>
          <i data-color="#3d9b50" style="background:#3d9b50"></i>
          <i data-color="#f59e0b" style="background:#f59e0b"></i>
          <i data-color="#111111" style="background:#111111"></i>
        </span>
        <button id="mt-size">粗细</button>
        <button id="mt-undo">撤销</button>
        <button id="mt-delete">删除</button>
        <button id="mt-close">×</button>
      </div>
      <div class="marker-canvas-wrap">
        <canvas id="marker-canvas"></canvas>
      </div>
      <div class="marker-footer">
        <button id="mt-cancel" class="btn">取消</button>
        <button id="mt-save" class="btn primary">保存标记</button>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
